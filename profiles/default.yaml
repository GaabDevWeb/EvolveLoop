# MegaBrain default profile — configuration / personalization boundary
# Profile ≠ Runtime. Core loads this; personal paths live in env (WIKI_ROOT), not here.
id: default
version: "1.0.0"

knowledge:
  # Default KnowledgeBackend implementation
  backend: wiki

memory:
  # Episodic session memory (wiki-mem) — complementary to Knowledge retrieval
  enabled: true
  provider: wiki-mem

# Host-specific values (WIKI_ROOT, AGENTS_ROOT, models) belong in environment /
# agents.env — never hardcode usernames or absolute home paths in this file.
environment:
  # workspace_root: set via AGENTS_ROOT / Cursor workspace — not duplicated here
  notes: "Set WIKI_ROOT (canonical) and optionally RAG_REPO_ROOT as alias"

preferences: {}
