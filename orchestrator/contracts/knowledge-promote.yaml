apiVersion: capability-orchestrator.io/v2
kind: Contract
metadata:
  id: knowledge-promote
  version: "1.0.0"
  status: active

spec:
  capability: knowledge-promote
  type: worker
  semver:
    major: 1
    minor: 0
    patch: 0

  inputs:
    - name: promote-queue
      required: false
    - name: project
      required: false
    - name: episodic-query
      required: false

  outputs:
    - name: promote-result
      schema: artifacts/knowledge-promote@1.0.0
      required: true
    - name: episodic-digest
      required: false

  evidence:
    schema: evidence/worker-default@1.0.0

  compatible_with:
    - context-grounding@1.x
    - knowledge.search@1.x
    - documentation@1.x

  notes:
    - "Distinct from deterministic knowledge.search/inspect (RAG bridge)."
    - "Researcher (external) is out of scope — Wave C2."
    - "Never writes raw/."
