    name: sandbox_workspace_isolation
    lens: [Sandbox, Workspace, Security, Runtime]
    problem: Prevent agent-executed code from compromising host / tenants
    how: >
      V1 sandbox providers Docker (recommended), Process (unsafe), Remote;
      SDK Workspace LocalWorkspace | DockerWorkspace | RemoteAPIWorkspace | Cloud.
      Legacy: OH runtime image + ActionExecutionServer in container.
    evidence_label: DOCUMENTED
    sources:
      - https://docs.openhands.dev/openhands/usage/sandboxes/overview
      - https://docs.openhands.dev/sdk/arch/workspace
      - https://docs.openhands.dev/openhands/usage/architecture/runtime
    our_equivalence: NONE_TO_PARTIAL
    decision: ADAPT
    confidence: HIGH
    utility: HIGH

