flows:
  v1_local:
    text: >
      message → Conversation → Agent.step → condense → LLM → ActionEvents →
      security/confirm → ToolExecutor(workspace) → ObservationEvents → loop
    evidence: DOCUMENTED
  v1_remote:
    text: >
      same API → RemoteWorkspace → Agent Server HTTP/WS → isolated workspace
    evidence: DOCUMENTED
  v0_legacy:
    text: >
      Frontend → Backend EventStream ↔ CodeActAgent ↔ Runtime REST ↔ ActionExecutionServer
      (Bash/Jupyter/BrowserEnv)
    evidence: DOCUMENTED

