mechanisms:
  - id: M01_agent_loop
    name: Responses-API agent loop / turn
    problem: Orchestrate user ↔ model ↔ tools until turn completes
    how: >
      Build instructions+tools+input; POST Responses; consume SSE; execute tool calls;
      append outputs preserving exact prompt prefix; end turn on assistant message.
    evidence: DOCUMENTED
    sources:
      - https://openai.com/index/unrolling-the-codex-agent-loop/
    costs:
      - Quadratic JSON growth without cache hits
      - Harness complexity around cache-safe mutations
    failure_modes:
      - Mid-turn tool list reorder → cache miss (historical MCP bug documented)
      - Context exhaustion without compaction
    alternatives:
      - Chat Completions tool loop
      - previous_response_id stateful chaining (explicitly avoided for ZDR)
    our_mechanism: Orchestrator + orquestrar / PDA Task
    our_equivalence: SUBSTANTIAL
    our_composite: IMPLEMENTED_TESTED
    decision: ADAPT
    confidence: HIGH

  - id: M02_os_sandbox
    name: OS-enforced command sandbox
    problem: Bound what spawned commands can read/write/network
    how: >
      macOS Seatbelt; Linux/WSL bubblewrap+seccomp (+ Landlock fallback paths);
      Windows elevated/unelevated sandbox users/firewall. Refuse if policy unenforceable.
    evidence: DOCUMENTED
    observed_paths:
      - codex-rs/sandboxing/src/seatbelt*.sbpl
      - codex-rs/linux-sandbox/
      - codex-rs/bwrap/
    sources:
      - https://developers.openai.com/codex/sandboxing
      - https://developers.openai.com/codex/permissions
    costs:
      - Platform matrix / kernel feature dependencies
      - Compatibility fallbacks weaker than primary path
    failure_modes:
      - Missing bwrap / userns restrictions → warning or fallback
      - Silent unsandboxed run avoided by refuse-unenforceable policy
    our_mechanism: Sandbox UNKNOWN–PARTIAL (baseline)
    our_equivalence: ABSENT_TO_PARTIAL
    our_composite: UNKNOWN
    decision: PROTOTYPE
    confidence: MEDIUM

  - id: M03_approval_policy
    name: Approval policy orthogonal to sandbox
    problem: Decide when to pause for human (or auto_review) before crossing bounds
    how: >
      approval_policy on-request|never|granular categories; approvals_reviewer user|auto_review;
      MCP/app tools with side-effect/destructive annotations also elicit approval.
    evidence: DOCUMENTED
    sources:
      - https://developers.openai.com/codex/agent-approvals-security
      - https://developers.openai.com/codex/sandboxing
      - https://developers.openai.com/codex/config-reference
    costs:
      - Approval fatigue if too strict; risk if never+full-access
    failure_modes:
      - Misconfigured full access (danger-full-access + never)
      - Legacy untrusted policy confusion (retired in newer docs)
    our_mechanism: Policy Engine
    our_equivalence: PARTIAL
    our_composite: DOCUMENTED_PLUS_IMPLEMENTED
    decision: ADAPT
    confidence: HIGH

  - id: M04_permission_profiles
    name: Named permission profiles (beta)
    problem: One reusable FS+network posture instead of ad-hoc sandbox knobs
    how: >
      default_permissions + [permissions.*] with filesystem read|write|deny, network domains,
      extends :read-only|:workspace; mutually exclusive with legacy sandbox_mode.
    evidence: DOCUMENTED
    sources:
      - https://developers.openai.com/codex/permissions
    costs:
      - Migration / dual config systems during transition
      - Glob deny pre-expansion cost on some platforms
    failure_modes:
      - Combining permissions + sandbox_mode → legacy wins (documented)
      - Unsupported carveouts refused rather than silently weakened
    our_mechanism: Policy configs (partial)
    our_equivalence: PARTIAL
    decision: PROTOTYPE
    confidence: MEDIUM

  - id: M05_tool_router_registry
    name: ToolRouter / ToolRegistry dispatch
    problem: Route model function calls to built-in, MCP, collaboration handlers
    how: >
      Core tools registry + router maps ToolCall payloads; collaboration namespace tools
      (spawn_agent / send_message / followup_task) observed in router.rs.
    evidence: OBSERVED
    observed_paths:
