    note: Full handler catalog not exhaustively audited in this pass
    our_mechanism: Capability Registry + Provider Registry
    our_equivalence: SUBSTANTIAL
    decision: ALREADY_PRESENT
    confidence: HIGH
    residual: Do not create a parallel Agent Registry

