anti_patterns_observed:
  - id: AP01_mcp_outside_host_sandbox
    description: MCP tools not covered by Codex shell sandbox — easy to misread as “everything is sandboxed”
    evidence: DOCUMENTED
  - id: AP02_cache_break_mid_conversation
    description: Changing tools/model/sandbox mid-thread causes expensive cache misses
    evidence: DOCUMENTED
  - id: AP03_dual_permission_systems
    description: Legacy sandbox_mode vs permission profiles can surprise operators if both configured
    evidence: DOCUMENTED
  - id: AP04_full_access_never
    description: danger-full-access + never removes both technical and social brakes
    evidence: DOCUMENTED

