    name: over_agentization
    description: Hundreds of personas without shared capability IR, policy, or evidence gates
    label: INFERRED
    premises:
      - 279 personas OBSERVED
      - no runtime orchestrator OBSERVED
      - SECURITY.md states non-executable definitions

  - id: AP-AA-02
    name: directory_name_false_friend_testing
    description: testing/ looks like test suite but is persona division
    label: OBSERVED
    resolution: prefer file contents + divisions.json

  - id: AP-AA-03
    name: marketing_multi_agent_ambiguity
    description: README/NEXUS language implies synchronized agency; delivery is prompts + host
    label: DOCUMENTED_vs_OBSERVED
    resolution: prefer SECURITY.md + code inventory

install_kinds:
  per-agent:
    description: one rendered file/dir per agent
    examples: [claude-code, cursor, codex, opencode, gemini-cli]
  roster:
    description: one combined file for all selected agents
    examples: [aider, windsurf]
  plugin:
    description: built artifact, not per-agent string renderable
    examples: [hermes]

absence:
  package_managers: [package.json, pyproject.toml, Cargo.toml, go.mod]
  semver_tags: true  # none OBSERVED (audit: 0 tags)
