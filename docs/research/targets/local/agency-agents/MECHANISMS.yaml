mechanisms:
  - id: M-AA-01
    name: specialist_persona_roster
    problem: Lack of deep domain role framing in generic assistants
    mechanism: Large library of Markdown personas with identity, rules, deliverables, metrics
    evidence:
      - label: OBSERVED
        source: division/**/*.md count=279
      - label: DOCUMENTED
        source: README.md roster tables
    costs:
      - context/token load if many installed
      - maintenance surface (near-duplicates; originality CI)
      - role overlap / contradictory advice across personas
    failure_modes:
      - over-agentization (many files ≠ better system)
      - host silently drops agents (OpenCode ~119 limit — DOCUMENTED)
      - user confuses roster with multi-agent runtime
    alternatives:
      - fewer capability-scoped skills with contracts
      - dynamic retrieval of specialist snippets
    our_equivalence: PARTIAL
    our_state: skills + PDA roles (SUBSTANTIAL class) without bulk domain roster
    utility: CONDITIONALLY_USEFUL
    decision: REJECT  # bulk import
    confidence: HIGH

  - id: M-AA-02
    name: division_catalog_and_discovery
    problem: Finding the right specialist in a large set
    mechanism: divisions.json labels/icons/colors; README tables; Hermes search tool (when generated)
    evidence:
      - label: OBSERVED
        source: divisions.json
      - label: DOCUMENTED
        source: integrations/hermes/README.md
    our_equivalence: PARTIAL
    utility: USEFUL
    decision: DEFER
    confidence: MEDIUM

  - id: M-AA-03
    name: persona_prompt_architecture_schema
    problem: Inconsistent agent definitions
    mechanism: >
      YAML frontmatter (required name, description, color; optional emoji, vibe, services);
      body sections Identity/Mission/Critical Rules/Deliverables/Workflow/Communication/Metrics;
