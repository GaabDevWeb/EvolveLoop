        label: OBSERVED
      - path: skills/skills/engineering/domain-modeling/ADR-FORMAT.md
        label: OBSERVED
      - path: skills/CONTEXT.md
        label: OBSERVED
    costs:
      - Parallel knowledge system vs richer wikis
    failure_modes:
      - CONTEXT.md polluted with implementation (explicitly forbidden)
      - ADR spam if criteria ignored
    alternatives:
