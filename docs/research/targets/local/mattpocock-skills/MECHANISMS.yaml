mechanisms:
  - id: M-BUCKETS
    name: Bucket promotion lifecycle
    problem: Ship only stable skills while keeping drafts/retired visible in-repo
    how: >
      Folders engineering|productivity (promoted), in-progress (beta public),
      misc (kept, not promoted), deprecated (sink). CLAUDE.md invariants force
      README + plugin.json sync for promoted only.
    evidence:
      - path: skills/CLAUDE.md
        label: OBSERVED
      - path: .claude-plugin/plugin.json
        label: OBSERVED
      - path: skills/skills/in-progress/README.md
        label: OBSERVED
    costs:
      - Contributor process multiplies (README, plugin, docs, ask-matt)
    failure_modes:
      - Drift between plugin.json and README (invariant relies on humans/agents)
      - Marketplace pin lag behind plugin.json (DOCUMENTED in ADR 0002)
    alternatives:
      - Flat skills/ with tags
      - Generated flat copy for single-path manifests
    our_equivalence: PARTIAL
    decision: ADAPT
    confidence: HIGH
    utility: USEFUL

  - id: M-INVOKE-AXIS
    name: User-invoked vs model-invoked dual harness
    problem: Orchestration skills must not auto-fire; reusable disciplines must be discoverable
    how: >
      User-invoked: disable-model-invocation: true + policy.allow_implicit_invocation: false;
      human-facing short description. Model-invoked: rich trigger description; Skill-tool callable.
      Documented in .agents/invocation.md.
    evidence:
      - path: .agents/invocation.md
        label: OBSERVED
      - path: skills/skills/productivity/grill-me/agents/openai.yaml
        label: OBSERVED
      - path: skills/skills/engineering/tdd/agents/openai.yaml
        label: OBSERVED
    costs:
      - Context load of every model-invoked description
      - Cognitive load for user-invoked catalog
    failure_modes:
      - Desync Claude flag vs Codex policy (explicitly warned)
      - Model-invoked skill wrongly gated (CHANGELOG 1.2.2 writing-for-agents)
    alternatives:
      - All model-invoked (context pollution)
      - All user-invoked (no composition)
    our_equivalence: PARTIAL
    decision: ADAPT
    confidence: HIGH
    utility: USEFUL

  - id: M-SKILL-TOOL-COMPOSE
    name: Explicit Skill-tool composition
    problem: Cross-skill reuse with high invocation hit rate across harnesses
    how: >
      Operative steps say Call the Skill tool with "name" (or twice for two skills).
      No deep relative SKILL.md imports; no bare /name as operative command.
      User-invoked skills cannot be Skill-tool targets.
    evidence:
      - path: .agents/invocation.md
        label: OBSERVED
      - path: skills/skills/engineering/grill-with-docs/SKILL.md
        label: OBSERVED
      - path: skills/skills/productivity/grill-me/SKILL.md
        label: OBSERVED
    costs:
      - Requires harness Skill tool
      - Opaque wrappers if tool fails
    failure_modes:
      - Attempting to Skill-tool a user-invoked skill (forbidden by design)
      - Ambiguous "call with X and Y" parsed as one call
    alternatives:
      - Inline duplicated instructions
      - Relative markdown includes
    our_equivalence: PARTIAL
    decision: ADAPT
    confidence: HIGH
    utility: USEFUL

  - id: M-THIN-WRAPPER
    name: Thin user-invoked wrappers over primitives
    problem: Provide slash entrypoints without paying description load of primitives twice
    how: grill-me and grill-with-docs are ~1 operative line that Call Skill tool(s)
    evidence:
      - path: skills/skills/productivity/grill-me/SKILL.md
        label: OBSERVED
      - path: skills/skills/engineering/grill-with-docs/SKILL.md
        label: OBSERVED
    costs:
      - Hard to understand wrapper without reading primitive
    failure_modes:
      - Wrapper drifts from primitive behaviour (bodies are empty of logic)
    alternatives:
      - Monolithic grill-with-docs containing full grilling text
    our_equivalence: PARTIAL
    decision: ADAPT
    confidence: HIGH
    utility: USEFUL

  - id: M-ROUTER
    name: Human router skill (ask-matt)
    problem: Too many user-invoked skills to remember
    how: >
      Single user-invoked map of main flow, on-ramps, vocabulary layer, phase boundaries,
      standalone skills. Must be re-synced when catalog changes (CLAUDE.md rule).
    evidence:
      - path: skills/skills/engineering/ask-matt/SKILL.md
        label: OBSERVED
      - path: skills/CLAUDE.md
        label: OBSERVED
    costs:
      - Large router file; drift = "router that lies"
    failure_modes:
      - Stale routes after graduate/rename
    alternatives:
      - Only README index
      - Model-invoked router (defeats zero-load of user-invoked set)
    our_equivalence: PARTIAL
    decision: ADAPT
    confidence: MEDIUM
    utility: USEFUL

  - id: M-WRITE-AGENTS
    name: writing-for-agents methodology
    problem: Agent-consumed docs cause variance, sprawl, premature completion, sediment
    how: >
      Context pointers; context load vs cognitive load; information hierarchy /
      progressive disclosure / co-location; completion criteria; leading words;
      positive prompting; pruning; SKILL-MECHANICS for invocation/routers.
    evidence:
      - path: skills/skills/productivity/writing-for-agents/SKILL.md
        label: OBSERVED
      - path: skills/skills/productivity/writing-for-agents/SKILL-MECHANICS.md
        label: OBSERVED
    costs:
      - Meta-document length (~81 lines + mechanics)
      - Authoring discipline overhead
    failure_modes:
      - Methodology without evals (unmeasured)
      - Over-splitting documents
    alternatives:
      - Ad-hoc skill writing
      - Only token-minimization rules
    our_equivalence: PARTIAL
    decision: ADAPT
    confidence: HIGH
    utility: USEFUL
    notes: Optional PROTOTYPE — turn levers into skill-authoring checklist/evals

  - id: M-SETUP-HARD-SOFT
    name: Per-repo setup with hard vs soft dependencies
    problem: Engineering skills need tracker/labels/docs layout unevenly
    how: >
      setup-matt-pocock-skills writes CLAUDE/AGENTS ## Agent skills + docs/agents/*.
      ADR 0001: hard deps (to-tickets, to-spec, triage) get explicit setup pointer;
      soft deps use vague glossary/ADR prose.
    evidence:
      - path: skills/skills/engineering/setup-matt-pocock-skills/SKILL.md
        label: OBSERVED
      - path: .agents/adr/0001-explicit-setup-pointer-only-for-hard-dependencies.md
        label: OBSERVED
    costs:
      - One mandatory setup session for hard-dep flows
    failure_modes:
      - Soft-dep skills still weak without CONTEXT.md
      - Wrong tracker writes if setup skipped on hard deps
    alternatives:
      - Always require setup in every skill
      - Auto-detect without setup
    our_equivalence: PARTIAL
    decision: ADAPT
    confidence: MEDIUM
    utility: USEFUL

  - id: M-CONTEXT-ADR
    name: Domain glossary + minimal ADRs
    problem: Jargon misalignment and lost hard-to-reverse decisions
    how: >
      CONTEXT.md as glossary-only; optional CONTEXT-MAP for multi-context;
