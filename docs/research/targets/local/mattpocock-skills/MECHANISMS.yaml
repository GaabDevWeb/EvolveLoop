  - id: M-MAIN-FLOW
    name: Documented idea-to-ship skill flow
    problem: Multi-session delivery without owning the whole process framework
    how: >
      ask-matt main flow grill-with-docs → to-spec → to-tickets → implement(tdd, code-review);
      on-ramps triage/diagnose/wayfinder; phase boundaries continue|clear|handoff|subagent|compact;
      smart-zone awareness.
    evidence:
      - path: skills/skills/engineering/ask-matt/SKILL.md
        label: OBSERVED
      - path: skills/README.md
        label: DOCUMENTED
    costs:
      - Prompt-only; no evidence bus / IR
      - Relies on issue tracker config
    failure_modes:
      - Skipping to-spec after wayfinder (warned)
      - Context degradation past smart zone
    alternatives:
      - Heavy frameworks (GSD/BMAD/Spec-Kit) — product claim in README
      - MegaBrain orchestrator + Evidence Bus
    our_equivalence: PARTIAL
    decision: ADAPT
    confidence: MEDIUM
    utility: CONDITIONALLY_USEFUL
    notes: REJECT as replacement for MegaBrain runtime

