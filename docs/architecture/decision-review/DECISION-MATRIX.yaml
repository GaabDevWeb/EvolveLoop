  - id: DR-008
    topic: Capability + Provider registries / single orchestrator
    current_state: IMPLEMENTED core loop; DO-NOT-CHANGE
    evidence:
      research: ALREADY_PRESENT / REJECT duplicate
      audit: CONFIRMS registries; WEAKENS then sync restored jobs
      experiments: E-005 uses existing jobs path — no second orchestrator needed
    observed_scope: system baseline + E-005
    decision: KEEP
    confidence: HIGH
    rationale: Experiments reinforce using existing mechanisms; no evidence for second registry/orchestrator.
    limitations: []
    implementation_allowed_now: false
    follow_up: none
    research_reconciliation: CONFIRM DO-NOT-CHANGE

  - id: DR-009
    topic: Evidence Bus dual meaning
    current_state: Engine Evidence[] ≠ EvolveLoop FS evidence bus
    evidence:
      research: ALREADY_PRESENT (fragile)
      audit: WEAKENS equation
      experiments: no experiment altered this
    observed_scope: documentation/architecture
    decision: KEEP
    confidence: HIGH
    rationale: Preserve boundary; do not merge systems based on naming.
    limitations: []
    implementation_allowed_now: false
    follow_up: documentation clarity only if needed
    research_reconciliation: CONFIRM WEAKENS of naive ALREADY_PRESENT

  - id: DR-010
    topic: Policy Decision vs Enforcement coverage
    current_state: Authority wired on DeterministicProvider; not Mock/CursorSkill/JobFile
    evidence:
      research: ALREADY_PRESENT Policy
      audit: REFINES split
      experiments: E-005 does not close authority gap
    observed_scope: audit + baseline
    decision: DEFER
    confidence: MEDIUM
    rationale: Gap remains real but out of E-001/E-005 evidence; not auto-authorized by job resume success.
    limitations: []
    implementation_allowed_now: false
    follow_up: separate decision/experiment if prioritized
