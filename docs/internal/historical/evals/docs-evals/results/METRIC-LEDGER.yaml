comparisons:

  - experiment: E-001
    metric: activation_precision
    control_value: 0.3352272727272727
    treatments:
      T_SKILLS_5: { treatment_value: 0.5113636363636364, delta: 0.17613636363636365, relative_change: 0.5254237288135594 }
      T_SKILLS_10: { treatment_value: 0.42045454545454547, delta: 0.08522727272727276, relative_change: 0.25423728813559326 }
      T_TOKENS_40: { treatment_value: 0.3409090909090909, delta: 0.005681818181818188, relative_change: 0.01694915254237288 }
    interpretation: observed_difference_association_offline_harness

  - experiment: E-001
    metric: token_estimate
    control_value: 1673
    treatments:
      T_SKILLS_5: { treatment_value: 382, delta: -1291, relative_change: -0.7716676634787806 }
      T_SKILLS_10: { treatment_value: 789, delta: -884, relative_change: -0.5283921105797979 }
      T_TOKENS_40: { treatment_value: 1010, delta: -663, relative_change: -0.3962934847579199 }
    interpretation: observed_difference_PROXY_whitespace
    note: "~40% language reserved for T_TOKENS_40 only"
