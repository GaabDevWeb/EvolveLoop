    verdict: WEAKENED
    confidence: MEDIUM
    proxy_dependency: true
    sample_size:
      conditions: 4
      control_runs: 5
      treatment_runs: 15
      repetitions_per_condition: 5
    decision_readiness: MORE_EVIDENCE_REQUIRED

    scope: >
      Offline catalog harness only; deterministic overlap ranker; whitespace token_estimate PROXY;
      seed e001-v1-2026-09-18. Not live Cursor/MegaBrain injection.

    reasoning: >
      Subclaims A and B are sustained by E-001 and corroborated (same basis) by EV-007/EV-008.
      The original research hypothesis and success criteria also require task_success parity /
      improvement. That component remains NOT_MEASURED. Under canonical rules, a compound
      hypothesis with major untested success criterion is WEAKENED, not fully SUPPORTED.
      EV-007/EV-008 PASS does not convert H-001 into universal SUPPORTED.

    limitations:
