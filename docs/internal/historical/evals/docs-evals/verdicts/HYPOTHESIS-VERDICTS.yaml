      - task_success_NOT_MEASURED
      - live_host_injection_NOT_MEASURED
      - vendor_tokenizer_NOT_MEASURED
      - initial_sample_n5_per_condition
      - eval_corroboration_not_independent_replication

    allowed_claims:
