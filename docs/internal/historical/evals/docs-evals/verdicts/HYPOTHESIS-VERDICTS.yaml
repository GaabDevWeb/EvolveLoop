        statement: Catalog size / budget alters offline activation behavior (precision/recall/match)
        evidence_ids: [E001-EV-001, E001-EV-003]
        metric_ids: [E001-M-004]
        eval_ids: [EV-007]
        status: SUPPORTED
        sample: {conditions: 4, control_runs: 5, treatment_runs: 15, tasks: 176}
      - id: H-001-SC-B
        statement: Catalog size / truncation reduces prefix token_estimate (PROXY whitespace)
        evidence_ids: [E001-EV-001, E001-EV-003, E001-EV-004]
        metric_ids: [E001-M-007]
        eval_ids: [EV-008]
        status: SUPPORTED
        proxy_dependency: true
        token_note: "~40% reduction applies to T_TOKENS_40 only (not T5/T10)"
      - id: H-001-SC-C
        statement: Catalog budget improves or preserves live task_success
        evidence_ids: [E001-EV-002, E001-EV-003]
        metric_ids: [E001-M-009]
        eval_ids: []
